spring.application.name=coupon-system

# 비밀번호, JWT 키 등은 git에 올리지 않는 application-local.properties 에서 읽음
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/coupon_system
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration=86400000

# 예외 핸들러가 처리한 예외(쿠폰 소진, 중복 발급 등)는 WARN 로그로 남기지 않음
spring.mvc.log-resolved-exception=false
